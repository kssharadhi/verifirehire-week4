<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VerifyHire | Job Posting Checker</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><span class="eyebrow">AI / NLP CAPSTONE</span><h1>Verify<span>Hire</span></h1><p>Check a job description for patterns commonly found in suspicious job advertisements.</p></header><section class="panel"><label for="job">Job description</label><textarea id="job" rows="8" maxlength="10000" placeholder="Paste a job advertisement here (at least 15 characters)..."></textarea><button id="check">Analyze posting →</button><div id="result" role="status" aria-live="polite"></div></section><footer>Educational prototype trained on synthetic sample data. Never treat a prediction as proof of legitimacy. Verify company details independently.</footer></main><script>document.getElementById('check').addEventListener('click',async()=>{const el=document.getElementById('result'),text=document.getElementById('job').value;el.textContent='Analyzing...';try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');el.className=data.prediction==='potentially_fraudulent'?'warning':'okay';el.textContent=(data.prediction==='potentially_fraudulent'?'Potentially suspicious posting':'Likely genuine posting')+' · Estimated fraud score: '+(data.fraud_probability*100).toFixed(1)+'%. '+data.warning;}catch(e){el.className='warning';el.textContent=e.message;}});</script></body></html>
